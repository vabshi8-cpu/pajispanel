{% extends "base.html" %}
{% block body %}
<div class="card">
<h2>Login</h2>
<form method="post">
  <p><input name="username" placeholder="Username" required></p>
  <p><input name="password" type="password" placeholder="Password" required></p>
  <button type="submit">Login</button>
</form>
<p><a href="/register">No account? Register</a></p>
</div>
{% endblock %}
